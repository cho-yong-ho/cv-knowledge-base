[project]
name = "cv-knowledge-agent"
version = "0.1.0"
description = "Autonomous AI Agent for Computer Vision Knowledge Base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.7.0",
    "arxiv>=2.1.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

